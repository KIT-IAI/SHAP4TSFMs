[project]
name = "shap4tsfms"
version = "0.1.0"
description = "Efficient SHAP calculation for time-series foundation models applied to load forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chronos-forecasting",
    "common>=0.1.2",
    "matplotlib",
    "pandas",
    "scienceplots>=2.2.0",
    "tabpfn-time-series>=1.0.7",
    "torch>=2.6.0",
    "typer>=0.20.1",
    "workalendar",
    "xgboost>=3.1.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pdbpp>=0.11.7",
    "wandb>=0.23.1",
]
